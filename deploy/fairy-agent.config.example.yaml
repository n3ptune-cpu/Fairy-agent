# fairy-agent configuration: /etc/fairy-agent/config.yaml (Linux) or C:\ProgramData\fairy-agent\config.yaml
# (Windows). Everything that can change the machine is OFF unless you turn it on here. Unknown keys are errors.
# After a change: systemctl restart fairy-agent (Linux) / Restart-Service fairy-agent (Windows).

# Where the panel connects. Empty = this machine's Tailscale address (100.x.y.z) on port 9101; the agent waits
# up to 3 minutes for Tailscale at boot and refuses to start without one. 0.0.0.0 needs allow_all_interfaces.
# listen: 100.64.0.10:9101

# Accept connections only from the panel that added this machine (Add host) and from this machine itself. Off by
# default. With it on, your own `curl` from another machine gets no answer, and a new panel address needs a new
# Add host / Re-pair. An agent that has no panel on record (never added with Add host, or its last join code
# expired) then answers nobody but this machine until the Add host / Re-pair command has been run on it.
# only_from_panel: true

# Windows only. The agent uses its helper service's pipe only when the pipe belongs to SYSTEM or Administrators.
# Off by default in this release: another owner is only reported as a warning in agent.log. Switch it on after
# `fairy-agent.exe helper-status` has shown "helper pipe owner: S-1-5-32-544" (or S-1-5-18) on your PCs.
# require_helper_pipe_owner: true

# The panel's token for this machine (its token_env value), one line, at least 24 characters. Default: the file
# "token" next to this config. FAIRY_AGENT_TOKEN in the environment wins over the file.
# A token you write yourself must be long and RANDOM (`fairy-agent gen-token` prints one). The agent checks only
# the length, and nothing slows down somebody who tries tokens: one that can be guessed will be.
# token_file: /etc/fairy-agent/token
# A second, different token, only needed when fan_control, power_control, wol or self_update is enabled (the panel's
# control_token_env value). Default: the file "control-token" next to this config.
# control_token_file: /etc/fairy-agent/control-token

# hide_host_details: true      # send no hostname, a generic OS name and no hardware model

processes:
  enabled: true                # the panel's Processes tab (false: the agent never looks at other programs)
  cmdline: false               # true: Linux sends command lines (a filter blanks the secrets it recognises: best effort); Windows: program paths
  never_open: []               # Windows: programs listed by name only, never opened, e.g. [VALORANT-Win64-Shipping.exe]

gpu:
  nvidia_smi: auto             # auto | off | absolute path of nvidia-smi
  amdgpu: auto                 # Linux: auto (AMD GPUs via the amdgpu driver's /sys files, if any) | off
  windows: auto                # Windows: auto (AMD / Intel / other GPUs from Windows' own GPU counters) | off
  amd_adl: auto                # Windows: auto (Radeon temperature / watts from AMD's ADL, read only, if installed) | off
  interval_s: 2

# sensors:
#   acpi_thermal: true         # Windows: ACPI thermal-zone temperatures (often the only CPU-ish temperature)
#   coretemp: false            # Windows: CPU core temperatures and package watts from the Core Temp program, if
#                              #   it is running with "Enable global shared memory (SNMP)"; see AGENT.md

# The board's BMC (e.g. Supermicro X11SCA-F) over IPMI: temperatures, fans and voltages in the panel.
ipmi:
  enabled: false
  # transport: wmi             # Windows default: Windows' own IPMI driver (through the fairy-agent-helper service)
  # transport: ipmitool        # Linux default: ipmitool in-band (/dev/ipmi0; see AGENT.md for the udev rule)
  # host: 192.168.1.5          # ipmitool over the network instead (IPMI-over-LAN, needs a BMC user):
  # username: fairy            #   read-only BMC user is enough for sensors; fan control needs "Operator"/admin
  # password_env: BMC_PASSWORD #   env var (or env_file entry) holding the BMC password
  sensors: true
  sensor_interval_s: 10

# Supermicro fan control (panel: fan_control: {vendor: supermicro, control_token_env: ...}). Needs ipmi.
# A fixed speed set from the panel does not outlive its watchdog: on Linux the fans go back to auto_mode when
# the agent stops, restarts or is updated (set the speed again afterwards); on Windows when the helper stops.
# A speed below 100 % is refused while the CPU is at or above max_temp_c, for 5 minutes after the watchdog
# acted, and while no temperature is known (see AGENT.md, "Fan control").
fan_control:
  enabled: false
  min_duty: 30                 # never lower than 30 %
  max_temp_c: 80               # watchdog: at this CPU temperature (or with no reading for 30 s) fans go to 100 %
  auto_mode: optimal           # the BMC mode that counts as "not overridden"; boards without optimal: standard

# Shutdown / reboot from the panel (panel: power_control: true). Delayed, cancellable, logged.
power_control:
  enabled: false
  min_delay_s: 10

# Wake-on-LAN relay for sleeping machines on this LAN (panel: wol_relay: true).
wol:
  enabled: false
  allowed_macs: []             # empty = any MAC the panel asks for

# Self-update from the panel's Update button (panel: self_update: true). Off = the agent never updates itself.
# On: an admin's Update makes the agent download the latest Fairy-agent release from GitHub, check its signature
# (key built into this binary), install it, restart and roll back if the new version does not come up.
# Linux also needs deploy/fairy-agent-update.service and deploy/fairy-agent-update.polkit.rules; Windows:
# install-fairy-agent.ps1.
self_update:
  enabled: false
  # repo: n3ptune-cpu/Fairy-agent   # only for a fork; its releases must be signed with the same key

# Requests a minute, for everybody together, in each of three budgets that cannot use each other up:
# control requests (fan, power, Wake-on-LAN, BMC relay, update, helper stop / start, the first-time set of the
# approval trust) all together; approval challenges (POST /approval/challenge: an approved action costs one
# control request and one challenge); and POST /power cancel. One more is answered 429.
control_rate_per_min: 12

# Devices on this machine's LAN that the panel cannot reach itself; the agent reads them and passes the readings
# on (credentials stay here). Same entries as the panel's power_sources / ups. system_hint: self = this host
# (not for an agent merged into a Proxmox node: use power_links in the panel's agent entry instead).
# env_file: /etc/fairy-agent/devices.env     # KEY=value lines for the *_env names below (0640 root:fairy-agent)
power_sources: []
  # - {id: desk-plug, type: shelly, name: "Desk plug", url: "http://192.168.1.61", password_env: SHELLY_PW, system_hint: self}
  # - {id: tasmota-1, type: tasmota, url: "http://192.168.1.62"}
  # A plug that is in Home Assistant (e.g. a Tuya one): the watts of its power sensor, read-only. url is Home
  # Assistant itself (nothing after host:port), entity must be a sensor.* id, token_env names the variable in
  # env_file that holds a long-lived access token: `fairy-agent secret set HA_TOKEN` (never write the token here).
  # A Home Assistant token is never read-only: whoever holds it can control everything in that Home Assistant.
  # See AGENT.md, "Plugs that are in Home Assistant". Optional: max_age_s, ca_file (https), interval, and the
  # plug's other sensors: voltage_entity (V), current_entity (A), energy_entity (the total in kWh, not a power),
  # each a sensor.* id of its own. A sensor of those that fails leaves its value empty; the watts stay.
  # These three need fairy-agent 0.9.0: an agent up to 0.8.0 does not start with one of them in this file
  # ("field voltage_entity not found"). Update the agent first, add them afterwards.
  # - {id: ha-plug, type: homeassistant, name: "Rack plug", url: "http://192.168.1.10:8123", token_env: HA_TOKEN, entity: sensor.rack_plug_power}
  # - {id: ha-plug-2, type: homeassistant, url: "http://192.168.1.10:8123", token_env: HA_TOKEN, entity: sensor.lab_plug_power,
  #    voltage_entity: sensor.lab_plug_voltage, current_entity: sensor.lab_plug_current, energy_entity: sensor.lab_plug_energy}
ups: []
  # - {id: local, host: 127.0.0.1, username: monuser, password_env: NUT_PASSWORD}
